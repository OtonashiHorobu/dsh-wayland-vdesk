<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH 虚拟桌面</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <select id="session-select" aria-label="桌面"></select>
        <span id="meta" class="meta"></span>
        <div class="spacer"></div>
        <button id="audio-toggle" class="btn audio" type="button" title="声音默认静音，点击开启">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" class="i-muted"><path d="M4 6h2l3-2.5v9L6 10H4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11 6.2 13.8 9.8M13.8 6.2 11 9.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" class="i-sound"><path d="M4 6h2l3-2.5v9L6 10H4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11.2 5.6a3.4 3.4 0 0 1 0 4.8M12.9 4a5.6 5.6 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>声音</span>
        </button>
        <input id="volume" class="volume" type="range" min="0" max="100" value="65" step="1" disabled aria-label="音量" />
        <button id="fit-btn" class="btn icon" type="button" title="适应窗口">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="full-btn" class="btn icon" type="button" title="全屏">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 6h11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button id="refresh-btn" class="btn icon" type="button" title="重新连接">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 3v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <main id="stage">
        <div id="screen"></div>
        <div id="hint" class="hint">等待虚拟桌面…</div>
      </main>
      <footer id="status">
        <span id="conn" class="dot"></span>
        <span id="conn-text"></span>
        <span class="flex"></span>
        <span id="caps" class="caption"></span>
      </footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
